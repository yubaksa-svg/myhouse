<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yubaksa의 작은 집</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --sky-top: #7cc8f5;
    --sky-mid: #a9dcfa;
    --sky-low: #e4f5ff;
    --cloud: #ffffff;
    --heart: #ff69ad;
    --cheek: #e34198;
    --ink: #461036;
    --ink-soft: #6e3a5e;
    --chip-line: #e34198;
    --focus: #461036;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --sky-top: #232a5c;
      --sky-mid: #3b3577;
      --sky-low: #1c1b3a;
      --cloud: #e8e3ff;
      --ink: #ffe3f0;
      --ink-soft: #d9b8cf;
      --chip-line: #ff8fc4;
      --focus: #ffe3f0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --sky-top: #232a5c;
    --sky-mid: #3b3577;
    --sky-low: #1c1b3a;
    --cloud: #e8e3ff;
    --ink: #ffe3f0;
    --ink-soft: #d9b8cf;
    --chip-line: #ff8fc4;
    --focus: #ffe3f0;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--sky-low);
    background-image: linear-gradient(180deg, var(--sky-top) 0, var(--sky-mid) 90svh, var(--sky-low) 160svh);
    color: var(--ink);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* 하늘: 하트와 이름 */
  .sky {
    position: relative;
    height: 92svh;
    min-height: 26rem;
    display: grid;
  }
  .illo {
    grid-area: 1 / 1;
    display: block;
    width: 100%;
    height: 100%;
  }
  .nameplate {
    grid-area: 1 / 1;
    align-self: end;
    justify-self: center;
    text-align: center;
    padding: 0 1.5rem 2.5rem;
    pointer-events: none;
  }
  h1 {
    margin: 0;
    font-family: "Jua", "Gowun Dodum", sans-serif;
    font-weight: 400;
    font-size: clamp(3rem, 12vw, 6.5rem);
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .welcome {
    margin: 0.6rem 0 0;
    font-size: clamp(1rem, 3.6vw, 1.25rem);
    color: var(--ink-soft);
  }

  /* 아래 내용 */
  main {
    max-width: 36rem;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }
  section + section { margin-top: 4rem; }
  h2 {
    margin: 0 0 1rem;
    font-family: "Jua", "Gowun Dodum", sans-serif;
    font-weight: 400;
    font-size: 2rem;
    line-height: 1.2;
  }
  p { margin: 0 0 1rem; }

  .steps {
    list-style: none;
    margin: 0;
    padding: 0;
    counter-reset: step;
  }
  .steps li {
    counter-increment: step;
    display: grid;
    grid-template-columns: 2.25rem 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 0;
  }
  .steps li + li { border-top: 2px dotted color-mix(in srgb, var(--ink) 25%, transparent); }
  .steps li::before {
    content: counter(step);
    font-family: "Jua", sans-serif;
    font-size: 1.35rem;
    color: var(--cheek);
    text-align: center;
  }
  .status {
    font-size: 0.875rem;
    line-height: 1;
    padding: 0.4rem 0.7rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status.done { background: var(--heart); color: #fff; }
  .status.now { border: 2px solid var(--chip-line); color: var(--ink); }
  .status.next { border: 2px dashed color-mix(in srgb, var(--ink) 40%, transparent); color: var(--ink-soft); }

  footer {
    text-align: center;
    padding: 0 1.5rem 3rem;
    color: var(--ink-soft);
    font-size: 0.9375rem;
  }

  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>
</head>
<body>

<header class="sky">
  <canvas class="illo" aria-hidden="true"></canvas>
  <div class="nameplate">
    <h1>yubaksa</h1>
    <p class="welcome">제 작은 집에 놀러 오셨네요.</p>
  </div>
</header>

<main>
  <section aria-labelledby="about">
    <h2 id="about">안녕하세요</h2>
    <p>요즘 GitHub와 웹을 처음부터 하나씩 배우고 있어요. 이 페이지는 그 과정에서 직접 만든 첫 웹사이트예요.</p>
    <p>천천히, 하지만 꾸준히 쌓아 가는 중이에요. 하나를 배울 때마다 이곳에 기록해 둘게요.</p>
  </section>

  <section aria-labelledby="learning">
    <h2 id="learning">배우는 중인 것</h2>
    <ol class="steps">
      <li><span>깃허브 계정 만들기</span><span class="status done">완료</span></li>
      <li><span>마크다운 연습하기</span><span class="status done">완료</span></li>
      <li><span>클로드와 깃허브 연결하기</span><span class="status now">진행 중</span></li>
      <li><span>웹페이지 만들기</span><span class="status now">진행 중</span></li>
      <li><span>배포하기</span><span class="status next">예정</span></li>
    </ol>
  </section>
</main>

<footer>2026 · yubaksa의 작은 집</footer>

<script src="https://cdn.jsdelivr.net/npm/zdog@1.1.3/dist/zdog.dist.min.js"></script>
<script>
(function () {
  const sky = document.querySelector('.sky');
  const illoElem = document.querySelector('.illo');
  const sceneSize = 96;
  const TAU = Zdog.TAU;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const illo = new Zdog.Illustration({
    element: illoElem,
    scale: 5.8,
  });

  // 캔버스를 하늘 영역 크기에 맞추기
  function fit() {
    const rect = sky.getBoundingClientRect();
    illo.setSize(rect.width, rect.height);
    const displaySize = Math.min(rect.width, rect.height * 0.85);
    illo.zoom = Math.max(2, Math.floor(displaySize / sceneSize));
    illo.translate.y = -rect.height * 0.06 / illo.zoom; // 이름 자리를 위해 살짝 위로
  }

  const heart = new Zdog.Group({ addTo: illo });
  const size = 4;
  const thickness = size / 10.538;
  const pink = '#ff69ad';

  // left top
  new Zdog.Cylinder({ addTo: heart, diameter: size/0.6075, length: thickness,
    translate: { x: -size/1.7325, y: -size/5.75 }, color: pink, backface: pink, stroke: false });
  // right top
  new Zdog.Cylinder({ addTo: heart, diameter: size/0.609, length: thickness,
    translate: { x: size/1.84, y: -size/5.75 }, color: pink, backface: pink, stroke: false });
  // bottom
  new Zdog.Cylinder({ addTo: heart, diameter: size/0.62, length: thickness,
    translate: { x: -size/80, y: size/2.45 }, color: pink, backface: pink, stroke: false });
  // left connector
  new Zdog.Box({ addTo: heart, width: size/1.15, height: size, depth: thickness,
    stroke: false, fill: true, color: pink,
    translate: { x: -size/1.88, y: size/3.04 }, rotate: { z: TAU/8.05 } });
  // right connector
  new Zdog.Box({ addTo: heart, width: size/1.15, height: size, depth: thickness,
    stroke: false, fill: true, color: pink,
    translate: { x: size/2.053, y: size/2.919 }, rotate: { z: -TAU/8 } });
  // cheeks
  new Zdog.Shape({ addTo: heart, translate: { x: -size/1.363, y: -size/10 }, stroke: size*3.77, color: '#e34198' });
  new Zdog.Shape({ addTo: heart, translate: { x: size/1.428, y: -size/10 }, stroke: size*3.77, color: '#e34198' });
  // eyes
  new Zdog.Shape({ addTo: heart, translate: { x: -size/4.0625, y: -size/3.389 }, stroke: size/0.893, color: '#461036' });
  new Zdog.Shape({ addTo: heart, translate: { x: size/4.75, y: -size/3.389 }, stroke: size/0.893, color: '#461036' });
  // mouth
  new Zdog.Shape({
    addTo: heart,
    path: [
      { x: -size/4.017, y: -size/25 },
      { bezier: [
        { x: -size/6.666, y: size/7.575 },
        { x: size/8.992, y: size/7.575 },
        { x: size/4.75, y: -size/25 },
      ]},
    ],
    closed: false, stroke: size/1.666, color: '#461036', backface: '#461036',
  });

  // 구름 만들기: [stroke 배수, x, y]
  function makeCloud(spec) {
    const group = new Zdog.Group({ addTo: illo });
    const parts = spec.map(([s, x, y]) => {
      const shape = new Zdog.Shape({ addTo: group, stroke: size * s, color: '#fff', translate: { x, y } });
      shape.baseY = y; // 흔들림 기준점
      return shape;
    });
    return { group, parts };
  }
  const cloud1 = makeCloud([
    [3, 0, 0], [3, size/5, -size/10], [3, size/5, size/10],
    [3, size/2.5, size/12.5], [3, size/2.22, -size/10], [2, size/1.66, 0],
  ]);
  const cloud2 = makeCloud([
    [3.5, 0, 0], [3.5, size/5, -size/10], [3.5, size/5, size/10],
    [2.5, size/2.5, size/12.5], [3, size/2.22, -size/10], [2, size/1.66, 0],
  ]);

  // 다크 모드에서는 구름 색을 하늘에 맞추기
  function paintClouds() {
    const c = getComputedStyle(document.documentElement).getPropertyValue('--cloud').trim() || '#fff';
    [cloud1, cloud2].forEach(cl => cl.parts.forEach(p => { p.color = c; }));
  }
  paintClouds();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paintClouds(); draw(Date.now() - start); });

  function draw(t) {
    heart.rotate.set({ y: Math.sin(t / 400) / 2.3, z: Math.sin(t / 400) / 8.1 });
    heart.translate.set({ y: Math.sin(t / 100) / 2 });
    cloud1.group.translate.set({ x: Math.sin(t / 2000) * 2 - size * 1.5, y: -size * 1.25, z: -1 });
    cloud2.group.translate.set({ x: Math.sin(t / 3000) * 5 + size / 2, y: size * 1.5, z: 1 });
    // 원본은 i=0에서 0으로 나눠 첫 조각이 사라지던 문제를 (i + 1)로 수정
    [cloud1, cloud2].forEach(cl => cl.parts.forEach((part, i) => {
      part.translate.y = part.baseY + Math.sin(t / (500 * ((i + 1) / 5))) * 0.15;
    }));
    illo.updateRenderGraph();
  }

  const start = Date.now();
  function animate() {
    draw(Date.now() - start);
    if (!reduceMotion.matches) requestAnimationFrame(animate);
  }

  fit();
  window.addEventListener('resize', () => { fit(); draw(Date.now() - start); });
  reduceMotion.addEventListener('change', () => { if (!reduceMotion.matches) animate(); });
  animate();
})();
</script>
</body>
</html>
